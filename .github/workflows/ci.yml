name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ① 数据完整性：不依赖浏览器/网络，多 Python 版本矩阵
  data-integrity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 号码范围 / 期号 / 三源一致性校验
        run: python scripts/validate_data.py
      - name: 公开版无平台与本地标识
        run: |
          if grep -qE 'data-page-node-id|<!--pnid:|/page/page_comm/inject.js|C:/Users/|/space/d/' lottery_lib.html; then
            echo "::error::公开版页面仍含内部标识"; exit 1
          fi
          echo "OK: 页面为干净公开版"

  # ② 统计检验：纯 Node，固定种子可复现
  statistics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 边际概率 π 与理论期望 E
        run: node tests/marginal_probe.js
      - name: 数据 × 策略 walk-forward
        run: node tests/data_policy_probe.js
      - name: 多重比较校正（Bonferroni / BH-FDR）
        run: node tests/multiple_testing.js

  # ③ 浏览器回归门禁：7 个脚本 / 67 项断言
  browser-gate:
    runs-on: ubuntu-latest
    env:
      LOTTERY_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: 运行统一门禁
        run: node tests/run_gate.js

  # ④ 高功效 40 轮配对验证（耗时较长，仅 main 与手动触发）
  deep-verify:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 40 轮逐期配对 + 合成均匀对照
        run: node tests/strategy_final_verify.js
